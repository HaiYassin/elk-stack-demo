input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  if [message] {
    mutate {
      add_field => { "processed_at" => "%{@timestamp}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}